<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple calendar app with events stored in your browser.">
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calendar-app">
    <header class="app-header">
      <div>
        <p class="eyebrow">My Calendar</p>
        <h1 id="month-title"></h1>
      </div>
      <button id="today" class="secondary-button">Today</button>
    </header>

    <div class="controls" aria-label="Calendar navigation">
      <button id="previous" class="nav-button" aria-label="Previous month">←</button>
      <button id="next" class="nav-button" aria-label="Next month">→</button>
    </div>

    <section class="calendar-wrapper" aria-label="Monthly calendar">
      <div class="calendar" id="calendar"></div>
    </section>

    <section class="event-panel" aria-labelledby="event-heading">
      <h2 id="event-heading">Add an event</h2>
      <form id="event-form">
        <label>
          Event title
          <input id="event-title" type="text" maxlength="80" placeholder="e.g. Homework" required>
        </label>
        <label>
          Date
          <input id="event-date" type="date" required>
        </label>
        <label>
          Time
          <input id="event-time" type="time">
        </label>
        <label>
          Description
          <textarea id="event-description" maxlength="300" rows="3" placeholder="Optional"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit">Add event</button>
          <button type="button" id="clear-events" class="danger-button">Clear all events</button>
        </div>
      </form>
    </section>

    <section class="events-list" aria-labelledby="events-heading">
      <h2 id="events-heading">Events for selected day</h2>
      <div id="events"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
